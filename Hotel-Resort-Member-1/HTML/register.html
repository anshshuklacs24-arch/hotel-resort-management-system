<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Grand Haven Resort</title>
    <link rel="stylesheet" href="../CSS/login-register.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Grand <span>Haven</span> Resort</div>
    </header>
    <section class="page-title">
        <h1>Register</h1>
        <p>Hotel and Resort Management System</p>
    </section>
    <main class="container">
        <h1>Create Account</h1>
<form>
<div><label>Full Name</label><input type="text" placeholder="Enter your full name"></div><br>
<div><label>Email Address</label><input type="email" placeholder="Enter your email"></div><br>
<div><label>Phone Number</label><input type="tel" placeholder="Enter phone number"></div><br>
<div><label>Password</label><input type="password" placeholder="Create a password"></div><br>
<button class="btn">Register</button>
</form>
<p>Already have an account? <a href="login.html">Login</a></p>
    </main>
</body>
</html>
