<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Grand Haven Resort</title>
    <link rel="stylesheet" href="../CSS/gallery-contact.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Grand <span>Haven</span> Resort</div>
    </header>
    <section class="page-title">
        <h1>Contact</h1>
        <p>Hotel and Resort Management System</p>
    </section>
    <main class="container">
        <div class="form-box"><form><div class="form-grid">
<div><label>Name</label><input type="text" placeholder="Enter your name"></div>
<div><label>Email</label><input type="email" placeholder="Enter your email"></div>
<div><label>Phone</label><input type="tel" placeholder="Enter phone number"></div>
<div><label>Subject</label><input type="text" placeholder="Enter subject"></div>
<div class="full"><label>Message</label><textarea placeholder="Write your message"></textarea></div>
<div class="full"><button class="btn">Send Message</button></div>
</div></form></div>
    </main>
</body>
</html>
