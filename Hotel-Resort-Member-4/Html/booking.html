<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - Grand Haven Resort</title>
    <link rel="stylesheet" href="../CSS/booking-about.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Grand <span>Haven</span> Resort</div>
    </header>
    <section class="page-title">
        <h1>Booking</h1>
        <p>Hotel and Resort Management System</p>
    </section>
    <main class="container">
        <div class="form-box"><form><div class="form-grid">
<div><label>Full Name</label><input type="text" placeholder="Enter your name"></div>
<div><label>Email</label><input type="email" placeholder="Enter your email"></div>
<div><label>Phone Number</label><input type="tel" placeholder="Enter phone number"></div>
<div><label>Room</label><select><option>Deluxe Room</option><option>Executive Suite</option><option>Family Villa</option></select></div>
<div><label>Check-in Date</label><input type="date"></div>
<div><label>Check-out Date</label><input type="date"></div>
<div><label>Guests</label><select><option>1 Guest</option><option>2 Guests</option><option>3 Guests</option><option>4+ Guests</option></select></div>
<div><label>Room Type</label><select><option>Standard</option><option>Deluxe</option><option>Suite</option><option>Villa</option></select></div>
<div class="full"><label>Special Request</label><textarea placeholder="Enter any special request"></textarea></div>
<div class="full"><button class="btn">Submit Booking Request</button></div>
</div></form></div>
    </main>
</body>
</html>
